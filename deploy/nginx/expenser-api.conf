# Backend: reverse proxy to the Fastify server run by pm2 on 127.0.0.1:3001.
# Install: sudo cp deploy/nginx/expenser-api.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/expenser-api.conf /etc/nginx/sites-enabled/
# HTTPS is added by `sudo certbot --nginx -d expenser-api.juanromerodev.com`.
server {
    listen 80;
    listen [::]:80;
    server_name expenser-api.juanromerodev.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
