# Frontend: static Astro build published to /var/www/expenser by deploy/deploy.sh.
# Install: sudo cp deploy/nginx/expenser.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/expenser.conf /etc/nginx/sites-enabled/
# HTTPS is added by `sudo certbot --nginx -d expenser.juanromerodev.com`, which edits
# the installed copy in place (listen 443, certificates, HTTP→HTTPS redirect).
server {
    listen 80;
    listen [::]:80;
    server_name expenser.juanromerodev.com;

    root /var/www/expenser;
    index index.html;

    # Multi-page SSG: /login → /login/index.html. HTML, sw.js, the manifest and icons
    # revalidate on every request so PWA updates roll out promptly.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Fingerprinted assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
